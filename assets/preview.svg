<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <linearGradient id="page" x1="40" y1="20" x2="984" y2="748" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2F6FF"/>
      <stop offset="1" stop-color="#F8F5FF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4F7CFF"/>
      <stop offset="1" stop-color="#745CFF"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#34446F" flood-opacity=".15"/>
    </filter>
    <clipPath id="beforeClip">
      <rect x="42" y="184" width="448" height="336" rx="12"/>
    </clipPath>
    <clipPath id="afterClip">
      <rect x="534" y="184" width="448" height="336" rx="12"/>
    </clipPath>
  </defs>

  <rect width="1024" height="768" fill="url(#page)"/>
  <circle cx="930" cy="42" r="116" fill="#DCD5FF" opacity=".42"/>
  <circle cx="46" cy="730" r="132" fill="#CDE6FF" opacity=".46"/>

  <g font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif">
    <text x="512" y="62" text-anchor="middle" fill="#202638" font-size="34" font-weight="700">链接图标，一眼可见</text>
    <text x="512" y="96" text-anchor="middle" fill="#707A92" font-size="16">Linkmark 链接印记 · 自动发现、显示并本地缓存网站图标</text>

    <rect x="32" y="130" width="468" height="408" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="524" y="130" width="468" height="408" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>

    <circle cx="57" cy="154" r="7" fill="#AAB2C3"/>
    <text x="76" y="161" fill="#596176" font-size="19" font-weight="700">启用前</text>
    <text x="146" y="161" fill="#9AA2B3" font-size="14">Before</text>

    <circle cx="549" cy="154" r="7" fill="#5B70F2"/>
    <text x="568" y="161" fill="#34405C" font-size="19" font-weight="700">启用后</text>
    <text x="638" y="161" fill="#6773DB" font-size="14">After</text>

    <rect x="42" y="184" width="448" height="336" rx="12" fill="#FFFFFF" stroke="#E4E8F1"/>
    <image href="{{BEFORE_IMAGE}}" x="42" y="184" width="448" height="336"
      preserveAspectRatio="xMidYMid meet" clip-path="url(#beforeClip)"/>

    <rect x="534" y="184" width="448" height="336" rx="12" fill="#FFFFFF" stroke="#DDE3F4"/>
    <image href="{{AFTER_IMAGE}}" x="534" y="184" width="448" height="336"
      preserveAspectRatio="xMidYMid meet" clip-path="url(#afterClip)"/>

    <circle cx="512" cy="334" r="24" fill="url(#brand)" filter="url(#shadow)"/>
    <path d="M501 334h19m-7-7 7 7-7 7" fill="none" stroke="#FFFFFF" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round"/>

    <text x="512" y="592" text-anchor="middle" fill="#202638" font-size="26" font-weight="700">真实网站图标自动显示在链接前</text>
    <text x="512" y="623" text-anchor="middle" fill="#778199" font-size="15">首次获取后保存在思源工作空间，后续直接使用本地缓存</text>

    <g transform="translate(239 656)">
      <rect width="158" height="42" rx="21" fill="#EAF0FF"/>
      <circle cx="24" cy="21" r="8" fill="#4F7CFF"/>
      <text x="44" y="27" fill="#40506F" font-size="15" font-weight="600">真实 favicon</text>
    </g>
    <g transform="translate(433 656)">
      <rect width="158" height="42" rx="21" fill="#ECEAFF"/>
      <circle cx="24" cy="21" r="8" fill="#745CFF"/>
      <text x="44" y="27" fill="#40506F" font-size="15" font-weight="600">本地缓存</text>
    </g>
    <g transform="translate(627 656)">
      <rect width="158" height="42" rx="21" fill="#E9F7F3"/>
      <circle cx="24" cy="21" r="8" fill="#38B98A"/>
      <text x="44" y="27" fill="#40506F" font-size="15" font-weight="600">字母兜底</text>
    </g>
  </g>
</svg>
