name: Release plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag and plugin version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="${RELEASE_TAG#v}"
          VERSION="$(node -p "require('./plugin.json').version")"
          test "$TAG" = "$VERSION" || { echo "Tag $TAG does not match plugin version $VERSION"; exit 1; }

      - name: Check, build, and validate package
        run: |
          npm run check
          npm run build
          npm run check:package

      - name: Create marketplace package
        run: cd dist && zip -r ../package.zip .

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          NOTES="docs/releases/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" package.zip --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$RELEASE_TAG" package.zip --title "$RELEASE_TAG" --notes-file "$NOTES"
          else
            gh release create "$RELEASE_TAG" package.zip --title "$RELEASE_TAG" --generate-notes
          fi
